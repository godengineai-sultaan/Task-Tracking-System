<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Offline · Task Tracking & Productivity</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    /* Same design tokens as web/src/index.css (this page must work without the app bundle). */
    :root { color-scheme: light; --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6f6d68; --line: #e1e0d9;
      --accent: #256abf; --on-accent: #ffffff; --accent-soft: #e6f0fc; --accent-ink: #1c5cab; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #a3a29a;
      --line: #2c2c2a; --accent-soft: #16263b; --accent-ink: #86b6ef; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { margin: 0 0 12px; color: var(--ink-2); }
    #waiting { display: none; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
    button { margin-top: 8px; height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    small { display: block; margin-top: 14px; color: var(--ink-3); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>This page needs a connection. Nothing is lost: quick captures saved on this device sync automatically once you're back online and the app is open.</p>
    <p id="waiting" role="status" aria-live="polite"></p>
    <button type="button" id="retry">Try again</button>
    <small>Only the text of your captures is kept on this device until it syncs. Signing out deletes it.</small>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => location.reload());
    addEventListener('online', () => location.reload());
    try {
      const r = indexedDB.open('tt-offline', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('captures', { keyPath: 'clientRequestId' });
      r.onsuccess = () => {
        const c = r.result.transaction('captures', 'readonly').objectStore('captures').count();
        c.onsuccess = () => {
          if (!c.result) return;
          const el = document.getElementById('waiting');
          el.textContent = c.result === 1 ? '1 capture waiting to sync' : c.result + ' captures waiting to sync';
          el.style.display = 'block';
        };
      };
    } catch (e) { /* storage unavailable */ }
  </script>
</body>
</html>
